name: build
# push/pull_request triggers are off for now: builds and deploys only by a manual run
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release for the current version (main only, also for X.Y.Z patch versions)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # built-in mirror list (secret, not in the repo): "https://a/;https://b/"
  ELITE_MIRRORS: ${{ secrets.ELITE_MIRRORS }}
  # where "Send logs" uploads to (secret): "https://a;https://b"
  ELITE_LOG_HOSTS: ${{ secrets.ELITE_LOG_HOSTS }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      build_ref: ${{ steps.version.outputs.build_ref }}
    steps:
      # A launcher built without these can't reach the mirrors, send logs or update itself: no build at all then.
      - name: Required secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=""
          for k in ELITE_MIRRORS ELITE_LOG_HOSTS TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "$(printenv "$k" | tr -d '[:space:]')" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them in Settings > Secrets and variables > Actions > Repository secrets (not in an environment: the build jobs don't use one)."
            exit 1
          fi
          echo "Required secrets: present"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          WANT_RELEASE: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          tauri="$(python3 -c 'import json; print(json.load(open("app/tauri.conf.json"))["version"])')"
          if [ "$version" != "$tauri" ]; then
            echo "::error::Cargo.toml has $version, app/tauri.conf.json has $tauri: raise both"
            exit 1
          fi
          python3 scripts/release_notes.py check "$version"
          # a GitHub Release (and SignPath signing) only on main: automatically for a new X.Y.0,
          # or by hand through "Run workflow" with the release box ticked
          release=false
          build_ref="$GITHUB_SHA"
          if [ "$REF" = refs/heads/main ]; then
            if [ "$EVENT" = push ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              case "$version" in *.0) release=true ;; esac
            elif [ "$EVENT" = workflow_dispatch ] && [ "$WANT_RELEASE" = true ]; then
              if gh release view "v$version" >/dev/null 2>&1; then
                echo "::warning::Release v$version already exists, nothing to publish"
              else
                release=true
                # main may have moved on without a new version: the release is built from the commit the tag points to,
                # pinned by hash so a moved tag can't change it between jobs, and only if that commit is on main
                if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                  tag_sha="$(git rev-parse "v$version^{commit}")"
                  if ! git merge-base --is-ancestor "$tag_sha" HEAD; then
                    echo "::error::v$version points to ${tag_sha:0:7}, which is not on main: refusing to release it"
                    exit 1
                  fi
                  build_ref="$tag_sha"
                fi
              fi
            fi
          fi
          {
            echo "number=$version"
            echo "tag=v$version"
            echo "release=$release"
            echo "build_ref=$build_ref"
          } >> "$GITHUB_OUTPUT"
          echo "Version **$version**, GitHub Release in this run: **$release**" >> "$GITHUB_STEP_SUMMARY"

  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p elite-core -p elite-publish -p elite-cli
      - run: cargo test -p elite-core -p elite-publish -p elite-cli

  launcher:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
          - os: ubuntu-22.04
            args: "--bundles deb,appimage"
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.build_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: cargo install tauri-cli --version "^2" --locked
      # Self-update artifacts (the installer / AppImage / .deb / .app.tar.gz plus a .sig) are signed with the updater
      # key; the public key goes into the bundler config here, so the repository and local builds don't need it.
      - name: Build
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # the public key is keys/updater.pub (the launcher compiles it in too); updates come from the releases
          # of the repository that builds it, so a fork can test the whole cycle
          printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["https://github.com/%s/releases/latest/download/updater.json"]}}}' \
            "$(tr -d '[:space:]' < keys/updater.pub)" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/updater.conf.json"
          cargo tauri build ${{ matrix.args }} --config "$RUNNER_TEMP/updater.conf.json"
      - uses: actions/upload-artifact@v4
        with:
          name: elite-launcher-${{ matrix.os }}
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/dmg/*.dmg
          retention-days: 7
      - name: Normalize installers for deploy
        shell: bash
        env:
          V: ${{ needs.version.outputs.number }}
        run: |
          set -e
          out=deploy; mkdir -p "$out"
          case "${{ runner.os }}" in
            Windows)
              cp target/release/bundle/nsis/*_x64-setup.exe "$out/EliteLauncher-$V-setup.exe"
              cp target/release/bundle/nsis/*_x64-setup.exe.sig "$out/EliteLauncher-$V-setup.exe.sig"
              mkdir -p pz/EliteLauncher
              cp target/release/elite-launcher.exe pz/EliteLauncher/EliteLauncher.exe
              [ -f target/release/WebView2Loader.dll ] && cp target/release/WebView2Loader.dll pz/EliteLauncher/ || true
              (cd pz && 7z a -tzip "../$out/EliteLauncher-$V-windows-portable.zip" EliteLauncher >/dev/null)
              ;;
            Linux)
              cp target/release/bundle/appimage/*_amd64.AppImage "$out/EliteLauncher-$V.AppImage"
              cp target/release/bundle/appimage/*_amd64.AppImage.sig "$out/EliteLauncher-$V.AppImage.sig"
              cp target/release/bundle/deb/*_amd64.deb "$out/elite-launcher_${V}_amd64.deb"
              cp target/release/bundle/deb/*_amd64.deb.sig "$out/elite-launcher_${V}_amd64.deb.sig"
              git ls-files | grep -v private > srcfiles.txt   # tracked-only: не тянуть собранные артефакты в src-зип
              python3 - "$V" <<'PY'
          import sys,zipfile
          V=sys.argv[1]
          fs=[l.strip() for l in open('srcfiles.txt') if l.strip()]
          z=zipfile.ZipFile('deploy/elite-launcher-src-%s.zip'%V,'w',zipfile.ZIP_DEFLATED)
          for f in fs: z.write(f,'elite-launcher-%s/%s'%(V,f))
          z.close()
          PY
              ;;
            macOS)
              app=$(find target -type d -name '*.app' -path '*/bundle/macos/*' | head -1)
              [ -n "$app" ] || app=$(find target -type d -name '*.app' | head -1)
              echo "app bundle: $app"
              ditto -c -k --keepParent "$app" "$out/EliteLauncher-$V-mac.zip"
              # the self-update replaces the whole .app from this archive
              upd=$(find target -name '*.app.tar.gz' -path '*/bundle/macos/*' | head -1)
              cp "$upd" "$out/EliteLauncher-$V-mac.app.tar.gz"
              cp "$upd.sig" "$out/EliteLauncher-$V-mac.app.tar.gz.sig"
              ;;
          esac
          ls -la "$out"
      # Windows: подпись через SignPath Foundation (бесплатно для OSS). Включится, когда в репозитории будут
      # секрет SIGNPATH_API_TOKEN и переменные SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG.
      # Only builds that become a GitHub Release are signed: SignPath needs a manual approval for every request.
      - name: Upload unsigned Windows files
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' && needs.version.outputs.release == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: |
            deploy/*-setup.exe
            deploy/*-windows-portable.zip
          retention-days: 7
      - name: Sign with SignPath
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' && needs.version.outputs.release == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use the signed Windows files
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' && needs.version.outputs.release == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cp -f signed/* deploy/
          # SignPath changed the installer: sign it for the self-update again, over the final file
          cargo tauri signer sign "deploy/EliteLauncher-${{ needs.version.outputs.number }}-setup.exe"
      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ matrix.os }}
          path: deploy/*
          retention-days: 7

  publisher:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p elite-publish -p elite-cli
      - uses: actions/upload-artifact@v4
        with:
          name: elite-publish-${{ matrix.os }}
          path: |
            target/release/elite-publish*
            target/release/elite-cli*
          retention-days: 7

  # Everything a real upload to the mirrors does, against a temporary store and a one-off key. The upload itself is
  # skipped until the mirrors and the real signing key are available to CI.
  publish:
    needs: [version, core, launcher]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - name: Paths
        run: |
          {
            echo "KEYS=$RUNNER_TEMP/keys"
            echo "DIST=$RUNNER_TEMP/dist"
            echo "STORE=$RUNNER_TEMP/store"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.build_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: elite-launcher-*
          path: ${{ runner.temp }}/dist
      - name: One-off signing key
        run: |
          cargo build -q -p elite-publish
          ./target/debug/elite-publish keygen "$KEYS"
          # the public key is compiled in: rebuild so that `verify` checks against the one-off key
          cp "$KEYS/public.key" keys/public.key
          cargo build -q -p elite-publish
      - name: Publish into a temporary store
        run: |
          ./target/debug/elite-publish version "$DIST" "$STORE" "launcher-$VERSION" "$KEYS/private.key"
          url="https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
          printf '{"schema":1,"launcher_update":{"version":"%s","urls":{"all":"%s"}}}\n' "$VERSION" "$url" > "$STORE/launcher.json"
          ./target/debug/elite-publish sign "$STORE/launcher.json" "$KEYS/private.key"
          ./target/debug/elite-publish verify "$STORE"
      - name: Summary
        run: |
          {
            echo "### Launcher $VERSION: dry-run publish"
            echo '```'
            (cd "$DIST" && find . -type f -printf '%s\t%P\n' | awk -F'\t' '{printf "%10.1f MB  %s\n", $1/1e6, $2}')
            echo '```'
            echo "Store: $(find "$STORE/blobs" -type f | wc -l) blobs, $(du -sh "$STORE" | cut -f1); signatures OK."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the mirrors
        run: |
          echo "::notice::Upload to the mirrors skipped: no server access and no real signing key in CI yet"
          echo "Upload to the mirrors: **skipped** (no server access yet)" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up
        if: always()
        run: |
          rm -rf "$KEYS" "$DIST" "$STORE"
          git checkout -- keys/public.key

  # After a merge to main: tag vX.Y.Z if it is new. A GitHub Release with the installers (the same files as the
  # download folder) for a new X.Y.0, or for any version through "Run workflow" with the release box ticked.
  release:
    needs: [version, publish]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || needs.version.outputs.release == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag
        id: tag
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "new=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: needs.version.outputs.release == 'true'
        with:
          pattern: deploy-*
          merge-multiple: true
          path: dist
      - name: GitHub Release
        if: needs.version.outputs.release == 'true'
        run: |
          {
            python3 scripts/release_notes.py notes "$VERSION"
            echo
            echo "**Code signing policy:** [CODE_SIGNING.md](https://github.com/$REPO/blob/main/CODE_SIGNING.md)." \
              "Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
          } > release-notes.md
          # what the launcher's self-update reads (releases/latest/download/updater.json); the .sig files go into it
          python3 scripts/updater_manifest.py "$VERSION" "https://github.com/$REPO/releases/download/$TAG" dist > dist/updater.json
          rm -f dist/*.sig
          gh release create "$TAG" dist/* --title "Elite Launcher $VERSION" --notes-file release-notes.md --verify-tag

  # A run on main (started by hand: the workflow has no push trigger) ships the installers to the download folder
  # on the server: rsync to "$DEPLOY_USER@$DEPLOY_HOST:" (variables and key in the dow2 environment); the key is
  # scoped on the server, write-only into that one folder.
  deploy:
    needs: [version, launcher]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: dow2
    env:
      V: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deploy-*
          merge-multiple: true
          path: dist
      - name: Build latest.json
        run: |
          rm -f dist/*.sig   # self-update signatures only matter in updater.json on the GitHub Release
          cat > dist/latest.json <<EOF
          {
            "version": "$V",
            "files": {
              "win": "EliteLauncher-$V-setup.exe",
              "win_portable": "EliteLauncher-$V-windows-portable.zip",
              "linux": "EliteLauncher-$V.AppImage",
              "deb": "elite-launcher_${V}_amd64.deb",
              "mac": "EliteLauncher-$V-mac.zip",
              "src": "elite-launcher-src-$V.zip"
            }
          }
          EOF
          ls -la dist
      - name: Rsync to the download folder
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          USER: ${{ vars.DEPLOY_USER }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -d -m700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          rsync -rtvz --omit-dir-times \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            dist/ "$USER@$HOST:"
