<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DoW Launcher</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="nettest.css">
<link rel="stylesheet" href="replays.css">
<link rel="stylesheet" href="fame.css">
<link rel="stylesheet" href="sigils.css">
<!-- the game's art extracted by scripts/game-art: overrides of the art slots (style.css :root) and the icons -->
<link rel="stylesheet" href="img/ui/art.css">
<script src="img/ui/art.js"></script>
<script src="nettest.js" defer></script>
<script src="nodeq.js" defer></script>
</head>
<body>
<div class="app">
  <header>
    <!-- 1.5.12 (owner 12.11.2026): DoW Launcher, variant D - the game's logo arrangement: DAWN of WAR over a red Roman II, LAUNCHER in silver as its edition line -->
    <div class="brand dow-d"><span class="dd-sr">DoW Launcher — Dawn of War II</span><span class="dd-logo" aria-hidden="true"><b class="dd-ii">II</b><span class="dd-w">Dawn <em>of</em> War</span><span class="dd-sub">Launcher</span></span><span class="dd-st"><span class="hdr-ver" id="hdrVer"></span><button class="hdr-info" id="newsBtn" data-ta="aboutNews" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg><b class="dot"></b></button></span>
      <!-- 1.6.11 (owner 14.11.2026): the news in a dropdown from (i) after the version (notes.js) -->
      <section class="me-box news-dd hidden" id="newsDd" role="dialog"><div class="nd-h"><b data-t="aboutNews"></b><span id="newsSub"></span><button class="x-btn" id="newsX" data-ta="closeX"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="news" class="news-list"></div><div class="nd-f"><button class="link-btn" id="newsAll" data-t="newsAllVer"></button><span data-t="aboutAuto"></span></div></section></div>
    <nav><button class="tab on" data-view="home" data-t="home"></button><button class="tab" data-view="rooms" data-t="roomsTab"></button><button class="tab" data-view="replays" data-t="replaysTab"></button><button class="tab" data-view="addons" data-t="components"></button><button class="tab tab-ico" data-view="settings" data-ta="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></nav>
    <div class="hdr-me" id="hdrMe"><span id="mePlate"></span><section class="me-box hidden" id="meBox" role="menu"></section></div>
  </header>
  <!-- 1.5.3 (owner 10.11): the updates - a newer launcher, a newer Elite - in one strip under the header, one Update on the right;
       an invitation into a launcher lobby the same way, under it -->
  <!-- 1.6.11 (owner 14.11.2026): errors as red strips on top, 30 s each (notes.js); the "launcher updated" strip once per version -->
  <div class="err-bars" id="errBars"></div>
  <div class="ubar upd-done hidden" id="updDone" role="status"><i class="ub-ico sig" aria-hidden="true"></i><div class="ub-items"><div class="ub-it"><b id="updDoneT"></b><small id="updDoneS"></small></div></div><span class="bn-act"><button class="btn gold ub-btn" id="updDoneMore" data-t="updMore"></button><button class="x-btn" id="updDoneX" data-ta="closeX"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div>
  <div class="ubar hidden" id="updBar" role="status"><span class="ub-ico" aria-hidden="true"></span><div class="ub-items" id="updItems"></div><button class="btn gold ub-btn" id="updAll"></button></div>
  <div class="ubar inv hidden" id="invBar" role="alert"><span class="ub-ico" aria-hidden="true"></span><div class="ub-items" id="invItems"></div><span class="bn-act"><button class="btn small ghost" id="invNo"></button><button class="btn gold ub-btn" id="invYes"></button></span></div>
  <!-- 1.5.12 (owner 12.11): a ping (ready check / a call of the host) is a strip like the invitation; the order: updates, invitation, ping -->
  <div class="ubar inv pg hidden" id="pgBar" role="alert"><span class="ub-ico" aria-hidden="true"></span><div class="ub-items" id="pgItems"></div><span class="bn-act"><button class="btn small ghost" id="pgNo"></button><button class="btn gold ub-btn" id="pgYes"></button></span></div>
  <!-- 1.5.0: the banners under the header, the whole width: the launcher in the game folder, the forwarding offer, no game (folded) -->
  <div class="bn warn hidden" id="launcherBanner"><span id="launcherText"></span></div>
  <div class="bn warn hidden" id="fwdBanner"><span id="fwdText"></span><span class="bn-act"><button class="btn small ghost" id="fwdLater"></button><button class="btn gold small" id="fwdBtn"></button></span></div>
  <div class="bn hidden" id="gameBanner"><span id="gameBannerText"></span><span class="bn-act"><button class="btn small ghost" id="gameBannerMore"></button><button class="btn gold small" id="gameBannerBuy"></button></span></div>

  <main id="home" class="view home">
    <aside class="col">
      <section class="panel bandp ev-box hidden" id="evBox"></section>
      <!-- 1.6.11 (owner 14.11.2026): the open lobbies instead of the news (the news: the (i) after the version) - hlobby.js -->
      <section class="panel bandp hl-box" id="hlBox">
        <div class="h"><span data-t="roomsTab"></span><em id="hlN"></em><button class="h-link" id="hlAll" data-t="hlAll"></button></div>
        <div class="hl-list" id="hlList"></div>
      </section>
    </aside>

    <section class="col">
      <div id="announcements"></div>
      <div id="setup" class="setup hidden"></div>
      <div id="newsBox" class="panel fb">
        <!-- 1.6.11 (owner 14.11.2026): two groups - the players' rooms and the language of the messages (a menu, the original by
             default) on the left; the developers and the logs (they go to them) on the right -->
        <div class="h ch-head"><div class="ch-tabs" id="chTabs"><button class="ch-tab on" data-room="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h15M4 15h15M10 4L8 20M16 4l-2 16"/></svg><span data-t="chAll"></span></button>
          <div class="ch-lang"><button class="ch-lbtn" id="chLangBtn" data-ta="chLang" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span id="chLangCur"></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
            <div class="me-box ch-lmenu hidden" id="chLangMenu" role="menu"><div class="ch-lmh" data-t="chLangH"></div><button role="menuitemradio" data-lang="all"><span data-t="chOrig"></span><small data-t="chAsWritten"></small></button><button role="menuitemradio" data-lang="ru"><span>Русский</span><small data-t="chTranslated"></small></button><button role="menuitemradio" data-lang="en"><span>English</span><small data-t="chTranslated"></small></button></div></div></div>
          <div class="ch-devg"><button class="ch-tab ch-dev" data-room="dev"><i class="sig" aria-hidden="true"></i><span data-t="chDev"></span></button><button class="btn small logs-btn" id="sendLogsHome" data-ta="sendLogs"><span data-t="logsShort"></span></button></div></div>
        <div class="ch-pane" id="chatPane">
          <div class="ch-msgs" id="chMsgs"></div>
          <div class="ch-login hidden" id="chLoginRow"><span data-t="chSignInToWrite"></span><button class="btn gold small" id="chIn2" data-t="chLogin"></button></div>
          <div class="ch-rbar hidden" id="chReply" role="status"></div><div class="ch-send" id="chSendRow"><textarea id="chText" rows="2" maxlength="500" data-tp="chPlaceholder"></textarea><button class="btn-gold" id="chSend" data-t="fbSend"></button></div>
        </div>
        <div class="dev-pane hidden" id="devPane">
        <div class="fb-who"><span data-t="fbName"></span> <input id="fbName" maxlength="48"><span class="fb-id" id="fbId"></span></div>
        <div id="fbMsgs" class="fb-msgs"></div>
        <div id="fbPics" class="fb-pics"></div>
        <div class="fb-send">
          <textarea id="fbText" rows="3" data-tp="fbPlaceholder"></textarea>
          <div class="fb-btns"><button class="link-btn" id="fbAttach" data-t="fbAttach"></button><button class="btn-gold" id="fbSend" data-t="fbSend"></button></div>
        </div>
        <input type="file" id="fbFile" accept="image/*" multiple class="hidden">
        </div>
      </div>
    </section>

    <aside class="col">
      <section class="panel bandp on-box" id="onBox">
        <div class="h"><span data-t="online"></span><span class="on-total" id="onTotal"></span><nav class="on-links" id="onLinks"></nav></div>
        <div class="on-groups" id="onGroups"></div>
      </section>
      <!-- 1.5.3 (owner 10.11): the launcher lobby I am in, under Online - its players, who is ready, back to it -->
      <section class="panel lr-mini hidden" id="lrMini" aria-live="polite"></section>
      <section class="panel addons hidden" id="compBox">
        <div class="h"><span data-t="components"></span><button class="h-link" id="allComps" data-t="allAddons"></button></div>
        <div id="components" class="addon-list"></div>
      </section>
    </aside>
  </main>

  <!-- 1.5.0 (D): a panel on the left - your lobby (create / back to it), the open lobbies, the running matches; on the right the
       list or your lobby. The open lobbies are one list: the launcher's rooms (marked) and the game's lobbies, with filters. -->
  <main id="rooms" class="view hidden">
    <div class="rwrap">
      <nav class="rnav" id="rNav">
        <div class="rtop" id="rTop"></div>
        <button class="rnb on" data-r="open" id="rOpenBtn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21h16M6 21V4h9v17M15 6h3v15M12 12h.01"/></svg><span class="lbl" data-t="rOpen"></span><span class="n" id="rOpenN"></span></button>
        <button class="rnb" data-r="live" id="rLiveBtn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="lbl" data-t="rLive"></span><span class="n" id="rLiveN"></span></button>
        <div class="rleg"><span><span class="tag lr" data-t="rTagLr"></span> <span data-t="rLegLr"></span></span><span data-t="rLegGame"></span></div>
      </nav>
      <div class="rmain">
        <section class="panel rpage" id="rOpen">
          <div class="h"><span data-t="rOpen"></span><em id="roomsN"></em></div>
          <div class="rflt" id="rFlt"></div>
          <div class="rj-status hidden" id="rjStatus" role="status" aria-live="polite"><span id="rjText"></span><button class="btn small hidden" id="rjCancel" data-t="rjCancel"></button></div>
          <div class="rlist"><div class="rooms-grid" id="rCards"><div class="rc-part" id="lrList"></div><div class="rc-part" id="roomsList"></div></div><div class="note r-empty hidden" id="rEmpty"></div></div>
        </section>
        <section class="panel rpage hidden" id="rLive">
          <div class="h"><span data-t="rLive"></span><em id="rLiveN2"></em></div>
          <div class="rflt" id="rLiveFlt"></div>
          <div class="note r-livenote" data-t="rLiveNote"></div>
          <div class="rlist"><div class="rooms-grid" id="rLiveCards"></div></div>
        </section>
        <div class="lr-room hidden" id="lrRoom" aria-live="polite"></div>
      </div>
    </div>
  </main>

  <!-- 1.6.0 (owner 13.11.2026): the Replays tab - the player's own replays (Playback) and the shared pool on our server (replays.js) -->
  <main id="replays" class="view hidden">
    <div class="rwrap">
      <nav class="rnav" id="rpNav">
        <button class="rnb on" data-rp="mine"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M10 9l5 3-5 3z"/></svg><span class="lbl" data-t="rpMine"></span><span class="n" id="rpMineN"></span></button>
        <button class="rnb" data-rp="pool"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span class="lbl" data-t="rpPool"></span><span class="n" id="rpPoolN"></span></button>
      </nav>
      <div class="rmain">
        <section class="panel rpage rp-page">
          <div class="h"><span id="rpTitle"></span><em id="rpCount"></em><span class="rp-info" id="rpInfo" tabindex="0" role="note">i</span><button class="link-btn rp-reset hidden" id="rpReset" data-t="rpReset"></button><div class="rp-hact" id="rpAct"></div></div>
          <div class="note rp-note" id="rpNote"></div>
          <div class="rp-body"><div class="rp-lcol"><div class="rflt rp-flt" id="rpFlt"></div><div class="rp-list" id="rpList"></div><div class="rp-pager" id="rpPager"></div></div><div class="rp-det" id="rpDet"></div></div>
        </section>
      </div>
    </div>
  </main>

  <main id="addons" class="view hidden">
    <section class="panel addons-page">
      <div class="h hk-head addons-head"><span data-t="components"></span><span class="hk-note" id="addonCheckNote"></span><div class="hk-act"><button class="btn small" id="addonCheck" data-t="addonCheck"></button></div></div>      <div class="addon-all" id="allCompList"></div>
    </section>
  </main>

  <main id="settings" class="view hidden">
    <div class="set-wrap">
    <nav class="set-tabs"><button class="set-tab on" data-set="setMain"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span data-t="setGeneral"></span></button><button class="set-tab" data-set="setNet"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span data-t="netTab"></span></button><button class="set-tab" data-set="hotkeys"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span data-t="hotkeys"></span></button><button class="set-tab" data-set="setFame"><i class="sig sig-crown" aria-hidden="true"></i><span data-t="fameTitle"></span></button></nav>
    <!-- 1.5.0 (D): General in sections - Game and Launcher on the left, Maintenance and About on the right; a row is the name
         (with its note under it) on the left and the controls on the right -->
    <div class="set-col set-grid" id="setMain">
    <div class="set-stack">
    <section class="panel settings sec"><h3 data-t="secGame"></h3>
      <div class="fr wide"><div><span data-t="gameFolder"></span></div><div class="row"><div class="path" id="gameDir"></div><button class="btn small" id="browse" data-t="browse"></button><button class="btn small ghost" id="openDir" data-t="open"></button></div></div>
      <div class="fr"><div><span data-t="cache"></span><small data-t="cacheNote"></small></div><div class="row"><select id="cache"><option value="0">0</option><option value="2048">2 GB</option><option value="6144">6 GB</option><option value="12288">12 GB</option></select></div></div>
      <div class="fr"><div><span data-t="uiScale"></span><small data-t="uiScaleNote"></small></div><div class="row"><input type="range" id="uiScale" min="75" max="200" step="5" value="100"><span class="about-v" id="uiScaleVal">100%</span><button class="btn small" id="uiScaleSet" data-t="uiScaleSet"></button></div></div>
    </section>
    <section class="panel settings sec"><h3 data-t="secLauncher"></h3>
      <div class="fr"><div><span data-t="language"></span></div><div class="row"><select id="lang"><option value="">Default</option><option value="en">English</option><option value="ru">Русский</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select></div></div>
      <div class="fr"><div><span data-t="usageTitle"></span><small data-t="usageNote"></small></div><div class="row"><label class="chk"><input type="checkbox" id="usage"><span data-t="usage"></span></label></div></div>
      <div class="fr"><div><span data-t="behTitle"></span></div><div class="col"><label class="chk"><input type="checkbox" id="muteMention"><span data-t="muteMention"></span></label><label class="chk"><input type="checkbox" id="closeQuits"><span data-t="closeQuits"></span></label></div></div>
      <div class="fr"><div><span data-t="lsTitle"></span><small data-t="lsNote"></small></div><div class="row"><select id="lobbySound"><option value="soft" data-t="lsSoft"></option><option value="sharp" data-t="lsSharp"></option></select><button class="btn small ghost" id="lobbySoundTry" data-t="lsTry"></button></div></div>
    </section>
    </div>
    <div class="set-stack">
    <section class="panel settings sec"><h3 data-t="secService"></h3>
      <div class="fr"><div><span data-t="repairTitle"></span><small data-t="repairNote"></small></div><div class="row"><button class="btn small" id="repair" data-t="repair"></button></div></div>
      <div class="fr"><div><span data-t="junkTitle"></span><small data-t="junkNote"></small></div><div class="row"><button class="btn small red" id="junk" data-t="junk"></button></div></div>
      <div class="fr"><div><span data-t="diagTitle"></span><small data-t="sendLogsNote"></small></div><div class="row"><input id="diagName" data-tp="diagName"><button class="btn small" id="sendLogs" data-t="sendLogs"></button></div></div>
      <div class="fr"><div><span data-t="unTitle"></span><small data-t="unNote"></small></div><div class="row"><button class="btn small red" id="uninstall" data-t="unBtn"></button></div></div>
    </section>
    <section class="panel settings sec"><h3 data-t="aboutTitle"></h3>
      <div class="fr"><div><span id="about"></span><small data-t="aboutAuto"></small></div><div class="row"><button class="btn small ghost" id="aboutNews" data-t="aboutNews"></button></div></div>
      <div class="fr"><div><span data-t="aboutInstalled"></span></div><div class="row"><span class="about-v" id="aboutVer"></span></div></div>
      <div class="fr"><div><span data-t="aboutCode"></span><small data-t="aboutLicense"></small></div><div class="row about-links" id="aboutLinks"></div></div>
    </section>
    </div>
    </div>
    <!-- 1.4.8 (siritos 04.11): one tab "Network and servers"; 1.4.10 (05.11): two blocks in it - the game servers, then the
         launcher's servers with the mirror and the local network - each a panel of its own, the headings not sticky, Check on the right -->
    <div class="set-col hidden" id="setNet">
    <section class="panel settings">
      <div class="h net-h1"><span data-t="gnTitle"></span><span class="hk-note" id="gnWhen"></span><div class="hk-act"><button class="btn small" id="gnCheck" data-t="gnCheck"></button></div></div>
      <div class="note" id="gnNote"></div>
      <div class="net-list gn-list" id="gnList"></div>
    </section>
    <section class="panel settings">
      <div class="h net-h1"><span data-t="netTitle"></span><div class="hk-act"><button class="btn small" id="netCheck" data-t="netCheck"></button></div></div>
      <div class="note" id="netNote"></div>
      <div class="net-list" id="netList"></div>
      <label data-t="mirror"></label>
      <div class="row"><input id="mirror" placeholder="https://example.org/elite/"><button class="btn" id="saveMirror" data-t="save"></button></div>
      <div class="note" id="mirrorInfo"></div>
      <label data-t="lanTitle"></label>
      <div class="row"><label class="chk"><input type="checkbox" id="lanShare"><span data-t="lanShare"></span></label></div>
    </section>
    </div>
    <!-- 1.5.0 (D): the hotkeys in two panels - the main one (the grid of keys), then the commands and every key with the search -->
    <div class="set-col hidden" id="hotkeys">
    <section class="panel hk sec">
      <div class="h hk-head"><span data-t="hotkeys"></span><span class="hk-note" id="hkState"></span><div class="hk-act"><button class="btn small ghost" id="hkReset" data-t="hkReset"></button><button class="btn gold small hidden" id="hkSave" data-t="save"></button></div></div>
      <div class="hk-top">
        <label class="chk"><input type="checkbox" id="hkGrid"><span data-t="hkGrid"></span></label>
        <span class="note" data-t="hkGridNote"></span>
      </div>
      <div class="hk-grid" id="hkGridBox"></div>
    </section>
    <section class="panel hk sec">
      <h3 data-t="hkMain"></h3>
      <div class="hk-list" id="hkMain"></div>
      <div class="hk-all"><div class="hk-allh"><span data-t="hkAll"></span><input id="hkSearch" data-tp="hkSearch"></div><div class="hk-groups" id="hkAllList"></div></div>
      <div class="note hk-how" data-t="hkHow"></div>
    </section>
    </div>
    <!-- 1.6.10 (owner 14.11.2026): the Hall of Fame as a tab of Settings (fame.js) -->
    <div class="set-col hidden" id="setFame">
    <section class="panel sec fame-page"><h3 data-t="fameTitle"></h3><p class="note fame-lead" data-t="fameLead"></p><div class="fame-list" id="fameList"></div>
      <div class="row fame-foot"><button class="btn small ghost" id="fameSite" data-t="fameSite"></button></div></section>
    </div>
    </div>
  </main>

  <!-- 1.5.0: the version on the left, the status (progress, warnings) in the middle, Play on the right (the offers: the strip under the header) -->
  <footer>
    <div class="ver-pick">
      <div class="ver-list hidden" id="verList"></div>
      <button class="ver-btn" id="verBtn"></button>
    </div>
    <div class="status">
      <div class="status-line"><span id="statusText"></span></div>
      <div class="bar hidden" id="bar"><i id="barFill"></i></div>
      <div class="meta" id="statusMeta"></div>
      <div class="ver-warn hidden" id="verWarn"></div>
    </div>
    <button class="btn small hidden" id="cancel" data-t="cancel"></button>
    <button class="btn small red hidden" id="lrCancelFoot" data-t="lrCancel"></button>
    <span class="plw" id="playWrap"><button class="play" id="play"></button></span>
  </footer>
</div>
<div class="pop hidden" id="pop" role="dialog"></div>
<div class="toast hidden" id="toast"></div>
<script src="app.js"></script>
<script src="lroom.js"></script>
