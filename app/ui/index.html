<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elite Launcher</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="logo" id="title">ELITE MOD</span><span class="sub" id="subtitle">Dawn of War II · Retribution</span><span class="hdr-ver" id="hdrVer"></span></div>
    <nav><button class="tab on" data-view="home" data-t="home"></button><button class="tab" data-view="settings" data-t="settings"></button></nav>
  </header>

  <div class="banner launcher-banner hidden" id="launcherBanner"><span id="launcherText"></span><button class="btn gold hidden" id="launcherBtn"></button></div>

  <main id="home" class="view home">
    <aside class="col">
      <section class="panel news-panel">
        <div class="h" data-t="news"></div>
        <div id="news" class="news-list"></div>
        <button class="more hidden" id="newsMore"></button>
      </section>
      <section class="panel" id="linksBox">
        <div class="h" data-t="links"></div>
        <div id="links" class="links"></div>
      </section>
    </aside>

    <section class="col">
      <div id="announcements"></div>
      <div id="setup" class="setup hidden"></div>
      <div id="newsBox" class="panel fb">
        <div class="h"><span data-t="fbTitle"></span><button class="btn-line" id="sendLogsHome" data-t="sendLogs"></button></div>
        <div class="fb-who"><span data-t="fbName"></span> <input id="fbName" maxlength="48"><span class="fb-id" id="fbId"></span></div>
        <div id="fbMsgs" class="fb-msgs"></div>
        <div id="fbPics" class="fb-pics"></div>
        <div class="fb-send">
          <textarea id="fbText" rows="3" data-tp="fbPlaceholder"></textarea>
          <div class="fb-btns"><button class="link-btn" id="fbAttach" data-t="fbAttach"></button><button class="btn-gold" id="fbSend" data-t="fbSend"></button></div>
        </div>
        <input type="file" id="fbFile" accept="image/*" multiple class="hidden">
      </div>
    </section>

    <aside class="col">
      <section class="panel addons hidden" id="compBox">
        <div class="h" data-t="components"></div>
        <div id="components" class="addon-list"></div>
      </section>
      <div class="spacer"></div>
      <div class="ver-pick">
        <div class="ver-list hidden" id="verList"></div>
        <button class="ver-btn" id="verBtn"></button>
      </div>
      <div class="ver-warn hidden" id="verWarn"></div>
      <button class="play" id="play"></button>
    </aside>
  </main>

  <main id="settings" class="view hidden">
    <section class="panel settings">
      <div class="h" data-t="settings"></div>
      <label data-t="gameFolder"></label>
      <div class="row"><div class="path" id="gameDir"></div><button class="btn" id="browse" data-t="browse"></button><button class="btn" id="openDir" data-t="open"></button></div>
      <label data-t="language"></label>
      <div class="row"><select id="lang"><option value="">Auto</option><option value="en">English</option><option value="ru">Русский</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select></div>
      <label data-t="cache"></label>
      <div class="row"><select id="cache"><option value="0">0</option><option value="2048">2 GB</option><option value="6144">6 GB</option><option value="12288">12 GB</option></select><span class="note" data-t="cacheNote"></span></div>
      <label data-t="mirror"></label>
      <div class="row"><input id="mirror" placeholder="https://example.org/elite/"><button class="btn" id="saveMirror" data-t="save"></button></div>
      <div class="note" id="mirrorInfo"></div>
      <label data-t="usageTitle"></label>
      <div class="row"><label class="chk"><input type="checkbox" id="usage"><span data-t="usage"></span></label></div>
      <div class="note" data-t="usageNote"></div>
      <label data-t="trayTitle"></label>
      <div class="row"><label class="chk"><input type="checkbox" id="trayOnPlay"><span data-t="trayOnPlay"></span></label></div>
      <label data-t="repairTitle"></label>
      <div class="row"><button class="btn" id="repair" data-t="repair"></button><span class="note" data-t="repairNote"></span></div>
      <label data-t="diagTitle"></label>
      <div class="row"><input id="diagName" data-tp="diagName"><button class="btn gold" id="sendLogs" data-t="sendLogs"></button></div>
      <div class="note" data-t="sendLogsNote"></div>
      <div class="about" id="about"></div>
    </section>
  </main>

  <footer>
    <div class="status">
      <div class="status-line"><span id="statusText"></span><button class="btn gold small hidden" id="updateBtn"></button></div>
      <div class="bar hidden" id="bar"><i id="barFill"></i></div>
      <div class="meta" id="statusMeta"></div>
    </div>
    <button class="btn small hidden" id="cancel" data-t="cancel"></button>
    <button class="btn small quick hidden" id="quick"></button>
  </footer>
</div>
<div class="pop hidden" id="pop" role="dialog"></div>
<div class="toast hidden" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
