<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elite Launcher</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="logo">ELITE Launcher</span><span class="hdr-ver" id="hdrVer"></span></div>
    <div class="launcher-banner hidden" id="launcherBanner"><span id="launcherText"></span><button class="btn gold small hidden" id="launcherBtn"></button></div>
    <nav><button class="tab on" data-view="home" data-t="home"></button><button class="tab" data-view="addons" data-t="components"></button><button class="tab" data-view="hotkeys" data-t="hotkeys"></button><button class="tab tab-ico" data-view="settings" data-ta="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></nav>
  </header>

  <main id="home" class="view home">
    <aside class="col">
      <section class="panel news-panel">
        <div class="h" data-t="news"></div>
        <div id="news" class="news-list"></div>
        <button class="more hidden" id="newsMore"></button>
      </section>
      <section class="panel" id="linksBox">
        <div class="h" data-t="links"></div>
        <div id="links" class="links"></div>
      </section>
    </aside>

    <section class="col">
      <div id="announcements"></div>
      <div id="setup" class="setup hidden"></div>
      <div id="newsBox" class="panel fb">
        <div class="h"><span data-t="fbTitle"></span><button class="btn gold logs-btn" id="sendLogsHome" data-t="sendLogs"></button></div>
        <div class="fb-who"><span data-t="fbName"></span> <input id="fbName" maxlength="48"><span class="fb-id" id="fbId"></span></div>
        <div id="fbMsgs" class="fb-msgs"></div>
        <div id="fbPics" class="fb-pics"></div>
        <div class="fb-send">
          <textarea id="fbText" rows="3" data-tp="fbPlaceholder"></textarea>
          <div class="fb-btns"><button class="link-btn" id="fbAttach" data-t="fbAttach"></button><button class="btn-gold" id="fbSend" data-t="fbSend"></button></div>
        </div>
        <input type="file" id="fbFile" accept="image/*" multiple class="hidden">
      </div>
    </section>

    <aside class="col">
      <section class="panel on-box" id="onBox">
        <div class="h" data-t="online"></div>
        <div class="on-groups" id="onGroups"></div>
        <button class="more hidden" id="onLadder" data-t="onLadder"></button>
      </section>
      <section class="panel addons hidden" id="compBox">
        <div class="h"><span data-t="components"></span><button class="h-link" id="allComps" data-t="allAddons"></button></div>
        <div id="components" class="addon-list"></div>
      </section>
      <div class="upd-box hidden" id="updBox"><div class="upd-text" id="updText"></div><button class="btn gold small" id="updateBtn"></button></div>
      <div class="ver-warn hidden" id="verWarn"></div>
    </aside>
  </main>

  <main id="addons" class="view hidden">
    <section class="panel addons-page">
      <div class="h" data-t="components"></div>
      <div class="addon-all" id="allCompList"></div>
    </section>
  </main>

  <main id="hotkeys" class="view hidden">
    <section class="panel hk">
      <div class="h"><span data-t="hotkeys"></span><span class="hk-note" id="hkState"></span></div>
      <div class="hk-top">
        <label class="chk"><input type="checkbox" id="hkGrid"><span data-t="hkGrid"></span></label>
        <span class="note" data-t="hkGridNote"></span>
      </div>
      <div class="hk-grid" id="hkGridBox"></div>
      <div class="h small" data-t="hkMain"></div>
      <div class="hk-list" id="hkMain"></div>
      <details class="hk-all"><summary data-t="hkAll"></summary>
        <input id="hkSearch" data-tp="hkSearch"><div class="hk-list" id="hkAllList"></div></details>
      <div class="row hk-act"><button class="btn gold" id="hkSave" data-t="save"></button><button class="btn" id="hkReset" data-t="hkReset"></button>
        <span class="note" data-t="hkHow"></span></div>
    </section>
  </main>

  <main id="settings" class="view hidden">
    <section class="panel settings">
      <div class="h" data-t="settings"></div>
      <label data-t="gameFolder"></label>
      <div class="row"><div class="path" id="gameDir"></div><button class="btn" id="browse" data-t="browse"></button><button class="btn" id="openDir" data-t="open"></button></div>
      <label data-t="language"></label>
      <div class="row"><select id="lang"><option value="">По умолчанию (Русский)</option><option value="en">English</option><option value="ru">Русский</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select></div>
      <label data-t="cache"></label>
      <div class="row"><select id="cache"><option value="0">0</option><option value="2048">2 GB</option><option value="6144">6 GB</option><option value="12288">12 GB</option></select><span class="note" data-t="cacheNote"></span></div>
      <label data-t="mirror"></label>
      <div class="row"><input id="mirror" placeholder="https://example.org/elite/"><button class="btn" id="saveMirror" data-t="save"></button></div>
      <div class="note" id="mirrorInfo"></div>
      <label data-t="usageTitle"></label>
      <div class="row"><label class="chk"><input type="checkbox" id="usage"><span data-t="usage"></span></label></div>
      <div class="note" data-t="usageNote"></div>
      <label data-t="trayTitle"></label>
      <div class="row"><label class="chk"><input type="checkbox" id="trayOnPlay"><span data-t="trayOnPlay"></span></label></div>
      <label data-t="repairTitle"></label>
      <div class="row"><button class="btn" id="repair" data-t="repair"></button><span class="note" data-t="repairNote"></span></div>
      <label data-t="diagTitle"></label>
      <div class="row"><input id="diagName" data-tp="diagName"><button class="btn gold" id="sendLogs" data-t="sendLogs"></button></div>
      <div class="note" data-t="sendLogsNote"></div>
      <label data-t="unTitle"></label>
      <div class="row"><button class="btn red" id="uninstall" data-t="unBtn"></button><span class="note" data-t="unNote"></span></div>
      <div class="about" id="about"></div>
    </section>
  </main>

  <footer>
    <div class="status">
      <div class="status-line"><span id="statusText"></span></div>
      <div class="bar hidden" id="bar"><i id="barFill"></i></div>
      <div class="meta" id="statusMeta"></div>
    </div>
    <button class="btn small hidden" id="cancel" data-t="cancel"></button>
    <div class="ver-pick">
      <div class="ver-list hidden" id="verList"></div>
      <button class="ver-btn" id="verBtn"></button>
    </div>
    <button class="play" id="play"></button>
  </footer>
</div>
<div class="pop hidden" id="pop" role="dialog"></div>
<div class="toast hidden" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
